openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client and vehicle management
  - name: reminders
    description: Reminder drafting and sending
  - name: ai
    description: Gemini-powered reminder drafting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [clients]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients with vehicles
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client and optional first vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client and their vehicles
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
  /clients/{id}/vehicles:
    post:
      operationId: createVehicle
      tags: [clients]
      summary: Add a vehicle to a client
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
  /vehicles/{id}:
    patch:
      operationId: updateVehicle
      tags: [clients]
      summary: Update a vehicle
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
  /vehicles/{id}/maintenance-items:
    post:
      operationId: createMaintenanceItem
      tags: [clients]
      summary: Add a maintenance item to a vehicle
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceItemInput"
      responses:
        "201":
          description: Created maintenance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
  /vehicles/{id}/odometer:
    patch:
      operationId: updateVehicleOdometer
      tags: [clients]
      summary: Record a current odometer reading
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OdometerInput"
      responses:
        "200":
          description: Updated vehicle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStatus"
  /maintenance-items/{id}:
    patch:
      operationId: updateMaintenanceItem
      tags: [clients]
      summary: Update a maintenance item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceItemUpdate"
      responses:
        "200":
          description: Updated maintenance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
    delete:
      operationId: deleteMaintenanceItem
      tags: [clients]
      summary: Remove a maintenance item
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Maintenance item removed
  /clients/{id}/reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List reminder history for a client
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reminder history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
  /reminders:
    post:
      operationId: markReminderSent
      tags: [reminders]
      summary: Save a sent reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Saved reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /ai/draft-reminder:
    post:
      operationId: draftReminder
      tags: [ai]
      summary: Draft a friendly WhatsApp reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftReminderInput"
      responses:
        "200":
          description: Drafted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReminderResult"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, phone, tier, retainerAmount, clientSince, notes]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        retainerAmount: { type: number }
        clientSince: { type: string, format: date }
        notes: { type: string }
    ClientSummary:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [vehicles]
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/VehicleStatus"
    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [vehicles, reminders]
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/VehicleStatus"
            reminders:
              type: array
              items:
                $ref: "#/components/schemas/Reminder"
    Vehicle:
      type: object
      required: [id, clientId, model, plate, registrationExpiry, insuranceExpiry, lastServiceDate, nextServiceDue, currentOdometer, nextServiceDueOdometer, odometerUpdatedAt, odometerLastAskedAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        model: { type: string }
        plate: { type: string }
        registrationExpiry: { type: string, format: date }
        insuranceExpiry: { type: string, format: date }
        lastServiceDate: { type: string, format: date }
        nextServiceDue: { type: string, format: date }
        currentOdometer: { type: integer, minimum: 0 }
        nextServiceDueOdometer: { type: integer, minimum: 0 }
        odometerUpdatedAt: { type: string, format: date-time }
        odometerLastAskedAt: { type: ["string", "null"], format: date-time }
    VehicleStatus:
      allOf:
        - $ref: "#/components/schemas/Vehicle"
        - type: object
          required: [overallStatus, dueItems, maintenanceItems]
          properties:
            overallStatus:
              type: string
              enum: [green, amber, red]
            dueItems:
              type: array
              items:
                $ref: "#/components/schemas/DueItem"
            maintenanceItems:
              type: array
              items:
                $ref: "#/components/schemas/MaintenanceItem"
    DueItem:
      type: object
      required: [key, kind, label, dueDate, daysUntilDue, dueOdometer, kmUntilDue, status, reminderSent]
      properties:
        key: { type: string }
        kind: { type: string, enum: [registration, insurance, service, odometer-checkin] }
        label: { type: string }
        dueDate: { type: ["string", "null"], format: date }
        daysUntilDue: { type: ["integer", "null"] }
        dueOdometer: { type: ["integer", "null"] }
        kmUntilDue: { type: ["integer", "null"] }
        status: { type: string, enum: [green, amber, red] }
        reminderSent: { type: boolean }
    MaintenanceItem:
      type: object
      required: [id, vehicleId, name, costAed, changeIntervalKm, lastChangedKm, nextDueKm, kmRemaining, status]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        name: { type: string }
        costAed: { type: number, minimum: 0 }
        changeIntervalKm: { type: integer, minimum: 0 }
        lastChangedKm: { type: integer, minimum: 0 }
        nextDueKm: { type: integer, minimum: 0 }
        kmRemaining: { type: integer }
        status: { type: string, enum: [green, amber, red] }
    Reminder:
      type: object
      required: [id, clientId, vehicleId, dueKey, messageText, draftedAt, sent]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        vehicleId: { type: integer }
        dueKey: { type: string }
        messageText: { type: string }
        draftedAt: { type: string, format: date-time }
        sent: { type: boolean }
        sentAt: { type: ["string", "null"], format: date-time }
        vehicleModel: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [clients, totalClients, totalVehicles, dueSoonCount, sentThisMonth]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientSummary"
        totalClients: { type: integer }
        totalVehicles: { type: integer }
        dueSoonCount: { type: integer }
        sentThisMonth: { type: integer }
    ClientInput:
      type: object
      required: [name, phone, tier, retainerAmount, clientSince, notes, vehicles]
      properties:
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        retainerAmount: { type: number }
        clientSince: { type: string, format: date }
        notes: { type: string }
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleInput"
    ClientUpdate:
      type: object
      required: [name, phone, tier, retainerAmount, clientSince, notes]
      properties:
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        retainerAmount: { type: number }
        clientSince: { type: string, format: date }
        notes: { type: string }
    VehicleInput:
      type: object
      required: [model, plate, registrationExpiry, insuranceExpiry, nextServiceDue, currentOdometer, nextServiceDueOdometer]
      properties:
        model: { type: string }
        plate: { type: string }
        registrationExpiry: { type: string, format: date }
        insuranceExpiry: { type: string, format: date }
        lastServiceDate: { type: string, format: date }
        nextServiceDue: { type: string, format: date }
        currentOdometer: { type: integer, minimum: 0 }
        nextServiceDueOdometer: { type: integer, minimum: 0 }
    VehicleUpdate:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
    MaintenanceItemInput:
      type: object
      required: [name, costAed, changeIntervalKm, lastChangedKm, nextDueKm]
      properties:
        name: { type: string, minLength: 1 }
        costAed: { type: number, minimum: 0 }
        changeIntervalKm: { type: integer, minimum: 0 }
        lastChangedKm: { type: integer, minimum: 0 }
        nextDueKm: { type: integer, minimum: 0 }
    MaintenanceItemUpdate:
      allOf:
        - $ref: "#/components/schemas/MaintenanceItemInput"
    OdometerInput:
      type: object
      required: [currentOdometer]
      properties:
        currentOdometer: { type: integer, minimum: 0 }
    ReminderInput:
      type: object
      required: [clientId, vehicleId, dueKey, messageText]
      properties:
        clientId: { type: integer }
        vehicleId: { type: integer }
        dueKey: { type: string }
        messageText: { type: string }
    DraftReminderInput:
      type: object
      required: [clientName, model, plate, dueLabel, reminderType, dueDate, daysUntilDue, currentOdometer]
      properties:
        clientName: { type: string }
        model: { type: string }
        plate: { type: string }
        dueLabel: { type: string }
        reminderType: { type: string, enum: [due-item, odometer-checkin] }
        dueDate: { type: ["string", "null"], format: date }
        daysUntilDue: { type: ["integer", "null"] }
        currentOdometer: { type: integer, minimum: 0 }
    DraftReminderResult:
      type: object
      required: [message]
      properties:
        message: { type: string }

