openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: clients
    description: Client and vehicle management
  - name: reminders
    description: Reminder drafting and sending
  - name: ai
    description: Gemini-powered reminder drafting
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [clients]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List clients with vehicles
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientSummary"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client and optional first vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      summary: Get a client and their vehicles
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Client detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
        "404":
          description: Client not found
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated client
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDetail"
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Remove a client and all their vehicles
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Client removed
        "404":
          description: Client not found
  /clients/{id}/vehicles:
    post:
      operationId: createVehicle
      tags: [clients]
      summary: Add a vehicle to a client
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Created vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
  /vehicles/{id}:
    patch:
      operationId: updateVehicle
      tags: [clients]
      summary: Update a vehicle
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleUpdate"
      responses:
        "200":
          description: Updated vehicle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vehicle"
    delete:
      operationId: deleteVehicle
      tags: [clients]
      summary: Remove a vehicle
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Vehicle removed
        "404":
          description: Vehicle not found
  /vehicles/{id}/maintenance-items:
    post:
      operationId: createMaintenanceItem
      tags: [clients]
      summary: Add a maintenance item to a vehicle
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceItemInput"
      responses:
        "201":
          description: Created maintenance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
  /vehicles/{id}/odometer:
    patch:
      operationId: updateVehicleOdometer
      tags: [clients]
      summary: Record a current odometer reading
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OdometerInput"
      responses:
        "200":
          description: Updated vehicle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStatus"
  /maintenance-items/{id}:
    patch:
      operationId: updateMaintenanceItem
      tags: [clients]
      summary: Update a maintenance item
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceItemUpdate"
      responses:
        "200":
          description: Updated maintenance item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceItem"
    delete:
      operationId: deleteMaintenanceItem
      tags: [clients]
      summary: Remove a maintenance item
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Maintenance item removed
  /clients/{id}/reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List reminder history for a client
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Reminder history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
  /reminders:
    post:
      operationId: markReminderSent
      tags: [reminders]
      summary: Save a sent reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Saved reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /ai/draft-reminder:
    post:
      operationId: draftReminder
      tags: [ai]
      summary: Draft a friendly WhatsApp reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftReminderInput"
      responses:
        "200":
          description: Drafted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftReminderResult"
  /documents/extract:
    post:
      tags: [ai]
      operationId: extractDocument
      summary: Extract structured data from a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentExtractionInput"
      responses:
        "200":
          description: Extracted document line items (a single receipt/bill may contain more than one billable item)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentExtraction"
  /clients/{id}/documents:
    get:
      tags: [clients]
      operationId: listClientDocuments
      summary: List documents for a client
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Client documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClientDocument"
    post:
      tags: [clients]
      operationId: createClientDocument
      summary: Create a client document
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientDocumentInput"
      responses:
        "201":
          description: Created client document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientDocument"
  /vehicles/{id}/mulkiya:
    patch:
      tags: [clients]
      operationId: updateVehicleMulkiya
      summary: Update a vehicle registration card image
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MulkiyaInput"
      responses:
        "200":
          description: Updated vehicle status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleStatus"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - name: iss
          in: query
          required: false
          schema: { type: string, format: uri }
      responses:
        "302":
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema: { type: string, default: / }
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL with a post-logout redirect back to the validated `returnTo` path.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileTokenExchangeSuccess" }
        "400": { description: Missing or invalid required fields., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Token did not contain usable claims., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Token exchange failed., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogoutSuccess" }
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400": { description: Missing or invalid required fields., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Failed to generate upload URL., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /storage/uploads/discard:
    post:
      tags: [Storage]
      operationId: discardUpload
      summary: Delete an unconfirmed private upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscardUploadRequest" }
      responses:
        "200":
          description: Upload deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscardUploadResult" }
        "400": { description: Invalid object path., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "401": { description: Authentication required., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "403": { description: Object is not owned by the current user., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: Unconditionally public — no authentication or ACL checks.
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content: { "*/*": { schema: { type: string, format: binary } } }
        "404": { description: File not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Failed to serve public object., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a private object entity from PRIVATE_OBJECT_DIR
      description: Serves private object entities uploaded via presigned URLs. Authentication and ACL checks are required.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
          description: Object path within the private object dir.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content: { "*/*": { schema: { type: string, format: binary } } }
        "404": { description: Object not found., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
        "500": { description: Failed to serve object., content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema: { type: string }
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema: { type: string }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Client:
      type: object
      required: [id, name, phone, tier, retainerAmount, clientSince, notes]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        retainerAmount: { type: number }
        clientSince: { type: string, format: date }
        notes: { type: string }
    ClientSummary:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [vehicles]
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/VehicleStatus"
    ClientDetail:
      allOf:
        - $ref: "#/components/schemas/Client"
        - type: object
          required: [vehicles, reminders]
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/VehicleStatus"
            reminders:
              type: array
              items:
                $ref: "#/components/schemas/Reminder"
    Vehicle:
      type: object
      required: [id, clientId, model, plate, registrationExpiry, insuranceExpiry, lastServiceDate, nextServiceDue, currentOdometer, serviceIntervalKm, nextServiceDueOdometer, odometerUpdatedAt, odometerLastAskedAt, mulkiyaImagePath]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        model: { type: string }
        plate: { type: string }
        registrationExpiry: { type: ["string", "null"], format: date }
        insuranceExpiry: { type: ["string", "null"], format: date }
        lastServiceDate: { type: ["string", "null"], format: date }
        nextServiceDue: { type: ["string", "null"], format: date }
        currentOdometer: { type: integer, minimum: 0 }
        serviceIntervalKm: { type: integer, minimum: 0 }
        nextServiceDueOdometer: { type: integer, minimum: 0 }
        odometerUpdatedAt: { type: string, format: date-time }
        odometerLastAskedAt: { type: ["string", "null"], format: date-time }
        mulkiyaImagePath: { type: ["string", "null"] }
    VehicleStatus:
      allOf:
        - $ref: "#/components/schemas/Vehicle"
        - type: object
          required: [overallStatus, dueItems, maintenanceItems, updateHistory]
          properties:
            overallStatus:
              type: string
              enum: [green, amber, red]
            dueItems:
              type: array
              items:
                $ref: "#/components/schemas/DueItem"
            maintenanceItems:
              type: array
              items:
                $ref: "#/components/schemas/MaintenanceItem"
            updateHistory:
              type: array
              items:
                $ref: "#/components/schemas/VehicleUpdateHistory"
    DueItem:
      type: object
      required: [key, kind, label, dueDate, daysUntilDue, dueOdometer, kmUntilDue, status, reminderSent]
      properties:
        key: { type: string }
        kind: { type: string, enum: [registration, insurance, service, odometer-checkin] }
        label: { type: string }
        dueDate: { type: ["string", "null"], format: date }
        daysUntilDue: { type: ["integer", "null"] }
        dueOdometer: { type: ["integer", "null"] }
        kmUntilDue: { type: ["integer", "null"] }
        status: { type: string, enum: [green, amber, red] }
        reminderSent: { type: boolean }
    MaintenanceItem:
      type: object
      required: [id, vehicleId, itemType, name, costAed, currentKm, changeIntervalKm, nextDueKm, dateRecorded, photoObjectPath, photoOriginalFileName, photoContentType, kmRemaining, status]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        itemType: { type: string, enum: [maintenance, payment] }
        name: { type: string }
        costAed: { type: number, minimum: 0 }
        currentKm: { type: ["integer", "null"], minimum: 0 }
        changeIntervalKm: { type: ["integer", "null"], minimum: 0 }
        nextDueKm: { type: ["integer", "null"], minimum: 0 }
        dateRecorded: { type: string, format: date }
        photoObjectPath: { type: ["string", "null"] }
        photoOriginalFileName: { type: ["string", "null"] }
        photoContentType: { type: ["string", "null"], enum: [image/jpeg, image/png, null] }
        kmRemaining: { type: ["integer", "null"] }
        status: { type: string, enum: [green, amber, red] }
    Reminder:
      type: object
      required: [id, clientId, vehicleId, dueKey, messageText, draftedAt, sent]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        vehicleId: { type: integer }
        dueKey: { type: string }
        messageText: { type: string }
        draftedAt: { type: string, format: date-time }
        sent: { type: boolean }
        sentAt: { type: ["string", "null"], format: date-time }
        vehicleModel: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [clients, totalClients, totalVehicles, dueSoonCount, sentThisMonth]
      properties:
        clients:
          type: array
          items:
            $ref: "#/components/schemas/ClientSummary"
        totalClients: { type: integer }
        totalVehicles: { type: integer }
        dueSoonCount: { type: integer }
        sentThisMonth: { type: integer }
    ClientInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1 }
        phone:
          type: string
          minLength: 7
          maxLength: 20
          pattern: '^\+?[0-9][0-9\s()\-]{6,19}$'
        tier: { type: string }
        retainerAmount: { type: number, minimum: 0 }
        clientSince: { type: string, format: date }
        notes: { type: string }
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleInput"
    ClientUpdate:
      type: object
      required: [name, phone, tier, retainerAmount, clientSince, notes]
      properties:
        name: { type: string }
        phone: { type: string }
        tier: { type: string }
        retainerAmount: { type: number }
        clientSince: { type: string, format: date }
        notes: { type: string }
    VehicleInput:
      type: object
      properties:
        model: { type: string }
        plate: { type: string }
        registrationExpiry: { type: string, format: date }
        insuranceExpiry: { type: string, format: date }
        lastServiceDate: { type: string, format: date }
        nextServiceDue: { type: string, format: date }
        currentOdometer: { type: integer, minimum: 0 }
        serviceIntervalKm: { type: integer, minimum: 0 }
        nextServiceDueOdometer:
          type: integer
          minimum: 0
          deprecated: true
          description: Backward-compatible alias for serviceIntervalKm in older clients.
    VehicleUpdate:
      allOf:
        - $ref: "#/components/schemas/VehicleInput"
    MaintenanceItemInput:
      type: object
      required: [itemType, name, costAed]
      properties:
        itemType: { type: string, enum: [maintenance, payment] }
        name: { type: string, minLength: 1 }
        costAed: { type: number, minimum: 0 }
        changeIntervalKm: { type: integer, minimum: 0 }
        currentKm: { type: integer, minimum: 0 }
        photoObjectPath: { type: string }
        photoOriginalFileName: { type: string }
        photoContentType: { type: string, enum: [image/jpeg, image/png] }
    MaintenanceItemUpdate:
      allOf:
        - $ref: "#/components/schemas/MaintenanceItemInput"
    OdometerInput:
      type: object
      required: [currentOdometer]
      properties:
        currentOdometer: { type: integer, minimum: 0 }
    ReminderInput:
      type: object
      required: [clientId, vehicleId, dueKey, messageText]
      properties:
        clientId: { type: integer }
        vehicleId: { type: integer }
        dueKey: { type: string }
        messageText: { type: string }
    DraftReminderInput:
      type: object
      required: [clientName, model, plate, dueLabel, reminderType, dueDate, daysUntilDue, currentOdometer]
      properties:
        clientName: { type: string }
        model: { type: string }
        plate: { type: string }
        dueLabel: { type: string }
        reminderType: { type: string, enum: [due-item, odometer-checkin] }
        dueDate: { type: ["string", "null"], format: date }
        daysUntilDue: { type: ["integer", "null"] }
        currentOdometer: { type: integer, minimum: 0 }
    DraftReminderResult:
      type: object
      required: [message]
      properties:
        message: { type: string }
    DocumentType:
      type: string
      enum: [service_bill, part_bill, parking_receipt]
    DocumentExtractionInput:
      type: object
      required: [objectPath, contentType]
      properties:
        objectPath: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png] }
    DocumentExtraction:
      type: object
      required: [documentType, date, amountAed, vendorName, description, warrantyExpiry]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        date: { type: ["string", "null"], format: date }
        amountAed: { type: ["number", "null"], minimum: 0 }
        vendorName: { type: string }
        description: { type: string }
        warrantyExpiry: { type: ["string", "null"], format: date }
    ClientDocumentInput:
      type: object
      required: [documentType, date, amountAed, vendorName, description, warrantyExpiry, objectPath, originalFileName, contentType]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        date: { type: string, format: date }
        amountAed: { type: number, minimum: 0 }
        vendorName: { type: string }
        description: { type: string }
        warrantyExpiry: { type: ["string", "null"], format: date }
        objectPath: { type: string }
        originalFileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        vehicleId: { type: ["integer", "null"] }
    ClientDocument:
      type: object
      required: [id, clientId, vehicleId, documentType, date, amountAed, vendorName, description, warrantyExpiry, objectPath, originalFileName, contentType, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        vehicleId: { type: ["integer", "null"] }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        date: { type: string, format: date }
        amountAed: { type: number, minimum: 0 }
        vendorName: { type: string }
        description: { type: string }
        warrantyExpiry: { type: ["string", "null"], format: date }
        objectPath: { type: string }
        originalFileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png] }
        createdAt: { type: string, format: date-time }
    MulkiyaInput:
      type: object
      required: [objectPath, originalFileName, contentType]
      properties:
        objectPath: { type: string }
        originalFileName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png] }
    VehicleUpdateHistory:
      type: object
      required: [id, vehicleId, fieldChanged, oldValue, newValue, changedAt]
      properties:
        id: { type: integer }
        vehicleId: { type: integer }
        fieldChanged: { type: string }
        oldValue: { type: string }
        newValue: { type: string }
        changedAt: { type: string, format: date-time }
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code: { type: string, minLength: 1 }
        code_verifier: { type: string, minLength: 1 }
        redirect_uri: { type: string, minLength: 1, format: uri }
        state: { type: string, minLength: 1 }
        nonce: { type: string, minLength: 1 }
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token: { type: string }
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { type: string }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, description: Original file name. }
        size: { type: integer, minimum: 1, description: File size in bytes. }
        contentType: { type: string, minLength: 1, description: MIME type of the file (e.g. `image/jpeg`). }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri, description: Presigned GCS URL for PUT upload. }
        objectPath: { type: string, description: Normalized object path. }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    DiscardUploadRequest:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, pattern: "^/objects/uploads/[A-Za-z0-9-]+$" }
    DiscardUploadResult:
      type: object
      required: [success]
      properties:
        success: { type: boolean, const: true }

